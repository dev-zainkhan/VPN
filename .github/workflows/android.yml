name: Android APKs

# Builds the Android app in GitHub's cloud (nothing to install on a laptop) and publishes two APKs
# in the "android-test" release; a phone can always download the newest ones from:
#   https://github.com/dev-zainkhan/VPN/releases/download/android-test/veil.apk       (release)
#   https://github.com/dev-zainkhan/VPN/releases/download/android-test/veil-test.apk  (test)
# The test APK can switch to another API address in Settings; the release APK cannot.

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  # The Veil API both APKs talk to. Set the repository variable VEIL_API_BASE to change it.
  VEIL_API_BASE: ${{ vars.VEIL_API_BASE || 'https://13-126-168-194.sslip.io' }}

jobs:
  release-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the android-test release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-test >/dev/null 2>&1 || \
            gh release create android-test --prerelease --title "Android builds" --notes "Building…"

  build:
    needs: release-page
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - variant: release
            test_build: 'false'
            apk: veil.apk
          - variant: test
            test_build: 'true'
            apk: veil-test.apk
    defaults:
      run:
        working-directory: android-app
    env:
      VEIL_TEST_BUILD: ${{ matrix.test_build }}
      VEIL_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build the APK
        working-directory: android-app/android
        # 64-bit ARM covers practically every phone in use; one architecture keeps the build fast.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ${{ matrix.apk }}
          gh release upload android-test ${{ matrix.apk }} --clobber
          gh release edit android-test --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}. API: ${VEIL_API_BASE}. veil.apk = release, veil-test.apk = test (server address can be changed in Settings)."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: android-app/${{ matrix.apk }}
          retention-days: 14
